[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tb3py"
version = "0.1.0"
description = "A Python wrapper around ThreeBodyTB.jl, Julia scientific library for tight binding calculations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "juliacall>=0.9.0",
    "juliapkg>=0.1.0",
]